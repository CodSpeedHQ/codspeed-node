packages:
  - examples/*
  - packages/*
  # Self-contained examples with their own pnpm workspace. with-electron-and-walltime
  # needs a different Node version; the with-vitest-* ones install the plugin as a
  # copy (`file:`) so it resolves `vitest` from the example, as in a real install.
  - "!examples/with-electron-and-walltime/**"
  - "!examples/with-vitest-v3/**"
  - "!examples/with-vitest-v4/**"
