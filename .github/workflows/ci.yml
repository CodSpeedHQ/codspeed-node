name: "CI"
on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: ["ubuntu-latest", "codspeedhq-arm64-ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Restore turbo cache
        uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm turbo run lint typecheck test

  native-abi:
    runs-on: "ubuntu-latest"
    name: Native addon ABI compatibility
    env:
      # The flags the runner passes in a real benchmark process. They cannot go
      # through NODE_OPTIONS (--allow-natives-syntax is rejected there), so jest
      # runs in-band under a flagged node instead of forking workers.
      NODE_OPTS: "--interpreted-frames-native-stack --allow-natives-syntax"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Restore turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          key-suffix: native-abi
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Build one prebuild set, then load it without rebuilding under each
      # runtime via the jest integ test. The other jobs compile the addon
      # with the Node version that loads it, so they cannot detect an ABI
      # mismatch.
      - run: pnpm turbo run build --filter=@codspeed/core

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node ${{ env.NODE_OPTS }} "$(node -p 'require.resolve("jest/bin/jest")')" -c jest.config.integ.js --runInBand tests/index.integ.test.ts
        working-directory: packages/core
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node ${{ env.NODE_OPTS }} "$(node -p 'require.resolve("jest/bin/jest")')" -c jest.config.integ.js --runInBand tests/index.integ.test.ts
        working-directory: packages/core

  list-examples:
    runs-on: "ubuntu-latest"
    name: List examples
    outputs:
      examples: ${{ steps.list-examples.outputs.examples }}
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          submodules: true
      # list the directories in ./examples and output them to a github action workflow variables as a JSON array
      - run: |
          examples=$(find ./examples -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "examples=$examples" >> $GITHUB_OUTPUT
        id: list-examples

  node-versions:
    runs-on: "ubuntu-latest"
    name: "${{ matrix.example }} on Node ${{ matrix.node-version }}"
    needs: list-examples
    strategy:
      matrix:
        node-version: ["22", "24"]
        example: ${{ fromJson(needs.list-examples.outputs.examples) }}
      fail-fast: false
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}
      - name: Restore turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          key-suffix: node${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm turbo run build

      - name: Run benchmarks with tinybench-plugin
        # use version from `main` branch to always test the latest version, in real projects, use a tag, like `@v2`
        uses: CodSpeedHQ/action@main
        with:
          mode: simulation
          run: pnpm --filter ${{ matrix.example }} bench-tinybench
        env:
          CODSPEED_SKIP_UPLOAD: true
          CODSPEED_DEBUG: true
      - name: Run benchmarks with benchmark.js-plugin
        # use version from `main` branch to always test the latest version, in real projects, use a tag, like `@v2`
        uses: CodSpeedHQ/action@main
        with:
          mode: simulation
          run: pnpm --filter ${{ matrix.example }} bench-benchmark-js
        env:
          CODSPEED_SKIP_UPLOAD: true
          CODSPEED_DEBUG: true
